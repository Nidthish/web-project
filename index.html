<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <title>Login Menu</title>
        <link rel="stylesheet" href="style.css">    
        <script src="sample.js"></script>
    </head>
    <body>
        <main>
        <div id="loginbox">
            <div id="left-box">
                <div>
                 <h1>Welcome to ExploreWorld</h1>
                 <p>Set out on a journey of a lifetime.</p>
                 <p>See the world in ways you’ve never imagined.</p> 
                 <p>Create stories you’ll want to share forever.</p>
                 <div id="link">
                    <a href="#Fullname"> start your journey</a>
                 </div>
                </div>
            </div>
            <div id="login">
            <h2 >Sign up</h2>
            <div id="name">
            <input type="text" id="Fullname" placeholder="Your Name" required>
            </div>
            <div id="email">
            <input type="email" id="email" placeholder="Email" required>
            </div>
            <div id="pass">
            <input type="password" id="Password" placeholder="Password" required>
            </div>
            <div>
                <input type="password" id="c_password" placeholder="Confirm Password" required>
            </div>
            <div class="input-submit">
          <button class="submit-btn" id="submit" onclick="signup()"> sign up</button>  
            </div> 
           <div id="sign">
            <p>Already a Member? </p>
            <a href="sign in.html" >sign in here</a>
           </div>
         </div>
        <div id="right_box">
            <div class="div">
                     <div style="width:2px; height:175px; background-color:#555; margin-left: 5px; margin-top: 50px;"></div>
                     <div class="sep">
                         <span>or</span>
                    </div>
                     <div style="width:2px; height:175px; background-color:#555;margin-left: 5px; margin-bottom: 50px; "></div>
            </div>
            <div class="sociallogin">
                    <img src="google.png" alt="google login">
                    <img src="facebook.png" alt="facebook">
                    <img src="x.png" alt="twitter">
                </div>
        </div>
         
    </main>
       
    </body>
</html>
