<!DOCTYPE html>

<html>
    <head>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
           
            body{
                padding: 0px;
                margin: 0px;
                font-family: 'poppins',sans-serif;
                height: 100vh;
                align-items: center;
                background: url("homebg.png");
                background-repeat: no-repeat;
                background-size: cover;
                background-position: center;
                color: white;
                backdrop-filter: blur(2px);
                -webkit-backdrop-filter: blur(2px);
            }

            header{
                margin: 0px;
                padding: 0px;
            }

            header nav{
                padding-top: 0px;
                margin-top: 0px ;
                display: flex;
                background: transparent;
                justify-content: space-between;
                align-items: center;
                color: white;
            }
            header nav h2{
                padding-bottom: 10px;
            }
            header nav a{
                color: white;
                text-decoration: none;
                margin-left: 5px;
                margin-right: 30px;
            }
            .content{
                margin-top: 50px;
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                height: 600px;
            }
            .box{
                width: 1000px;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: row;
                box-shadow: 0px 0px 5px rgb(0, 0, 0);
                background: url(homebg.png);
                background-position: center;
                background-repeat: no-repeat;
                background-size: cover;
                border-radius: 10px;
            }
            .left_box{
                padding-left: 45px;
                padding-right: 55px;
                width: 500px;
                height: 100%;
                background: transparent;
                display: flex;
                justify-content: center;
                flex-direction: column;
            }

            .right_box{
                display: flex;
                align-items: center;
                justify-content: center;
                background: transparent;
                width: 500px;
                height: 100%;
            }

            .menu
            {
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .menu:hover{
                cursor: pointer;
            }

        </style>
    </head>

    <body>
        <header>
            <nav>
                    <div class="menu">
                        <img src="menu.png" width="25px" height="20px" style="margin-left: 50px;" >
                        <a href="">Menu</a>
                    </div>
                <h2>TRAVEL</h2>
                <div class="menu">
                    <img src="pf.png" alt="" width="25px" height="25px">
                    <a href="sign in.html" style="margin-right: 50px;"> Login</a>
                </div>
            </nav>
        </header>
        <main class="content">
            <section class="box">
                <section class="left_box">
                <h2 style="font-size: 50px; margin: 0px; padding: 0px; ">
                    ASIA
                </h2>
                <p style="margin: 0px; padding:0px; margin-bottom: 30px; font-size: 13px; padding-right: 50px;">
                    Discover Asia – a land where ancient traditions meet modern wonders. From the Great Wall of China to the beaches of Thailand, the temples of India to the skyscrapers of Singapore, Asia is a journey of colors, flavors, and unforgettable experiences.
                </p>
                </section>
            <section  class="right_box">
                <h2></h2>
            </section>

            </section>
            
        </main>
    </body>

</html>
